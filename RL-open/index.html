<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WebCraft · 网页版我的世界</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='1' width='14' height='14' fill='%235da549'/%3E%3Crect x='4' y='4' width='8' height='8' fill='%234f9440'/%3E%3Crect x='7' y='1' width='2' height='3' fill='%234f9440'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <canvas id="game-canvas"></canvas>

  <div id="hud" class="hidden">
    <div id="crosshair"><div class="ch ch-v"></div><div class="ch ch-h"></div></div>

    <div id="hotbar"></div>

    <div id="loading-wrap">
      <div id="loading-label">正在生成地形…</div>
      <div id="loading-bar"><div id="loading-fill"></div></div>
    </div>

    <div id="info">WebCraft</div>
    <div id="notice"></div>
  </div>

  <div id="menu">
    <div class="panel">
      <h1>⛏ WebCraft</h1>
      <p class="subtitle">网页版我的世界 · 无限体素沙盒</p>

      <label class="field">
        <span>世界种子（留空则随机）</span>
        <input id="seed-input" type="text" maxlength="32" placeholder="例如: minecraft" autocomplete="off" />
      </label>

      <button id="start-btn" class="btn primary">开始游戏</button>
      <button id="save-btn" class="btn" disabled>保存进度</button>

      <div class="controls">
        <h2>操作说明</h2>
        <table>
          <tr><td>鼠标</td><td>视角（点击锁定鼠标）</td></tr>
          <tr><td>W A S D</td><td>移动</td></tr>
          <tr><td>空格</td><td>跳跃 / 飞行上升</td></tr>
          <tr><td>Shift</td><td>疾跑 / 飞行下降</td></tr>
          <tr><td>左键</td><td>破坏方块（按住连续）</td></tr>
          <tr><td>右键</td><td>放置方块</td></tr>
          <tr><td>1 – 9 / 滚轮</td><td>选择方块</td></tr>
          <tr><td>F</td><td>切换飞行模式</td></tr>
          <tr><td>R</td><td>回到出生点</td></tr>
          <tr><td>Esc</td><td>暂停 / 释放鼠标</td></tr>
        </table>
        <p class="hint">建议使用 Chrome / Edge 桌面浏览器</p>
      </div>
    </div>
  </div>

  <div id="paused" class="hidden">
    <div class="panel small">
      <h1>游戏暂停</h1>
      <button id="resume-btn" class="btn primary">继续游戏</button>
      <p class="hint">点击“继续”后将重新锁定鼠标</p>
    </div>
  </div>

  <script type="importmap">
    {
      "imports": {
        "three": "/node_modules/three/build/three.module.js"
      }
    }
  </script>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
