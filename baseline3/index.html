<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>网页版我的世界 · WebCraft</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%236abf3e'/%3E%3Crect width='16' height='5' fill='%2379553a'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game"></div>

  <div id="hud" class="hidden">
    <div id="crosshair"><span>+</span></div>
    <div id="tooltip"></div>
    <div id="hotbar"></div>
    <div id="debug"></div>
    <div id="water-overlay"></div>
  </div>

  <div id="menu" class="overlay">
    <div class="panel">
      <h1>网页版我的世界</h1>
      <p class="subtitle">WebCraft · 程序化体素世界</p>
      <div class="row">
        <label for="seed">世界种子</label>
        <input id="seed" type="text" value="" placeholder="留空随机">
      </div>
      <div class="row buttons">
        <button id="btn-new" class="primary">创建新世界</button>
        <button id="btn-continue">继续上次冒险</button>
      </div>
      <div class="controls">
        <h2>操作说明</h2>
        <p><b>W A S D</b> 移动 · <b>空格</b> 跳跃 / 游泳上浮</p>
        <p><b>Shift</b> 疾跑 · <b>Ctrl</b> 飞行下降 · <b>F</b> 切换飞行</p>
        <p><b>鼠标</b> 视角 · <b>左键</b> 破坏方块 · <b>右键</b> 放置方块</p>
        <p><b>1-9 / 滚轮</b> 选择方块 · <b>Esc</b> 暂停</p>
        <p class="tip">世界会无限生成，修改会自动保存到浏览器本地。</p>
      </div>
    </div>
  </div>

  <div id="pause" class="overlay hidden">
    <div class="panel">
      <h1>游戏暂停</h1>
      <div class="row buttons">
        <button id="btn-resume" class="primary">回到游戏</button>
        <button id="btn-save">保存进度</button>
        <button id="btn-reset">删除存档并重开</button>
      </div>
      <p class="tip">按 Esc 或点击「回到游戏」继续。存档保存在浏览器 localStorage。</p>
    </div>
  </div>

  <script src="lib/three.min.js"></script>
  <script src="js/noise.js"></script>
  <script src="js/textures.js"></script>
  <script src="js/world.js"></script>
  <script src="js/player.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
