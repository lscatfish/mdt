<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WebCraft · 网页版我的世界</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="viewport"></div>

  <div id="start-overlay" class="overlay">
    <div class="panel">
      <h1 class="logo">WebCraft</h1>
      <p class="subtitle">网页版体素沙盒 · 无限世界</p>
      <button id="start-btn" class="btn primary">▶ 开始游戏</button>
      <button id="help-btn" class="btn ghost">操作说明</button>
      <p class="hint">推荐使用桌面 Chrome / Edge，需要键盘与鼠标</p>
    </div>
  </div>

  <div id="pause-overlay" class="overlay hidden">
    <div class="panel">
      <h1 class="logo">游戏暂停</h1>
      <button id="resume-btn" class="btn primary">继续游戏</button>
      <button id="new-world-btn" class="btn ghost">🌍 生成新世界</button>
      <div class="controls-list">
        <p><b>W A S D</b> 移动 · <b>鼠标</b> 视角</p>
        <p><b>空格</b> 跳跃 · <b>双击空格 / F</b> 切换飞行</p>
        <p><b>左键</b> 破坏 · <b>右键</b> 放置 · <b>1-9 / 滚轮</b> 选择方块</p>
        <p><b>Shift</b> 潜行（飞行时下降） · <b>Ctrl</b> 疾跑</p>
      </div>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div id="crosshair"><span class="h"></span><span class="v"></span></div>
    <div id="block-name">草方块</div>
    <div id="hotbar"></div>
    <div id="debug"></div>
  </div>

  <div id="toast" class="hidden"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
